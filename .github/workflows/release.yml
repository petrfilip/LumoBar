name: Release

# Pushing a v<MAJOR>.<MINOR>.<PATCH> tag (or running the workflow by hand)
# builds, signs and packages LumoBar, creates the GitHub Release with the DMG,
# then deploys the Pages site: the landing page plus the fresh appcast.xml.
#
# Three jobs, so that each gets only the permissions it needs:
#   build         (macOS)   contents: read
#   release       (Ubuntu)  contents: write
#   deploy-pages  (Ubuntu)  pages: write, id-token: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version, MAJOR.MINOR.PATCH (e.g. 1.0.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build, sign and package
    # macos-26 runner ships with Xcode 17 + macOS 26 SDK, required for the
    # Liquid Glass APIs (GlassEffectContainer, glassEffect, .glassProminent)
    # used in the SwiftUI views. Earlier runners (macos-14/15) compile-fail
    # because the symbols aren't in the SDK even though guarded by
    # `if #available(macOS 26.0, *)`.
    runs-on: macos-26
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.marketing }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the build number is the commit count, the same
          # number scripts/build_app.sh computes on a developer machine.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate version
        id: version
        env:
          RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          CLEAN="${RAW_VERSION#v}"
          if [[ ! "$CLEAN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$RAW_VERSION' is not MAJOR.MINOR.PATCH (e.g. 1.2.3 or v1.2.3)."
            exit 1
          fi
          echo "marketing=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "Marketing version: $CLEAN"

      - name: Select latest Xcode (must include macOS 26 SDK)
        run: |
          # Pick the highest-numbered Xcode installed on the runner. macos-26
          # ships with Xcode 17.x by default, which contains the Liquid Glass
          # APIs we need.
          LATEST_XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$LATEST_XCODE" ]; then
            echo "No Xcode_*.app found in /Applications, falling back to xcode-select default."
          else
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Cache Swift build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Locate Sparkle tools
        id: sparkle
        run: |
          # sign_update comes from the SwiftPM-resolved Sparkle package. SwiftPM
          # checksum-verifies that binary artifact and it is the same Sparkle
          # version as the framework bundled in the app (see Package.resolved).
          SIGN_UPDATE="$PWD/.build/artifacts/sparkle/Sparkle/bin/sign_update"
          if [ ! -x "$SIGN_UPDATE" ]; then
            echo "::error::sign_update not found at $SIGN_UPDATE after 'swift package resolve'."
            ls -R .build/artifacts 2>/dev/null | head -50 || true
            exit 1
          fi
          echo "sign_update=$SIGN_UPDATE" >> "$GITHUB_OUTPUT"
          grep -A6 '"identity" : "sparkle"' Package.resolved || true

      - name: Verify Sparkle EdDSA keys (fails the release if missing or mismatched)
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SIGN_UPDATE: ${{ steps.sparkle.outputs.sign_update }}
        run: ./scripts/verify_sparkle_keys.sh "$SIGN_UPDATE"

      - name: Build, bundle and sign app
        env:
          VERSION: ${{ steps.version.outputs.marketing }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY || '-' }}
          # Embedded into the bundled Info.plist by build_app.sh. The build
          # number is left unset on purpose: build_app.sh uses the commit count.
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: ./scripts/build_app.sh

      - name: Notarize (skipped if Apple credentials are not configured)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Skipping notarization: Apple credentials are not set. The DMG will be ad-hoc signed only."
            exit 0
          fi
          ditto -c -k --sequesterRsrc --keepParent dist/LumoBar.app dist/LumoBar-notarize.zip
          xcrun notarytool submit dist/LumoBar-notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple dist/LumoBar.app
          rm dist/LumoBar-notarize.zip

      - name: Build DMG
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY || '-' }}
          # Package the app built (and possibly notarised and stapled) above
          # instead of rebuilding it.
          SKIP_APP_BUILD: '1'
        run: ./scripts/build_dmg.sh

      - name: Stage release artifact (rename DMG with version)
        id: stage
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
        run: |
          VERSIONED_DMG="dist/LumoBar-${MARKETING_VERSION}.dmg"
          mv dist/LumoBar.dmg "$VERSIONED_DMG"
          echo "dmg=$VERSIONED_DMG" >> "$GITHUB_OUTPUT"

      - name: Sign DMG with Sparkle EdDSA private key
        id: appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SIGN_UPDATE: ${{ steps.sparkle.outputs.sign_update }}
          DMG_PATH: ${{ steps.stage.outputs.dmg }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is required to sign the appcast."
            exit 1
          fi

          KEY_FILE="$(mktemp "${RUNNER_TEMP}/sparkle-key.XXXXXX")"
          trap 'rm -f "$KEY_FILE"' EXIT
          chmod 600 "$KEY_FILE"
          # Strip whitespace before writing: a GitHub paste sometimes captures
          # a trailing \n that breaks base64 decoding in sign_update.
          printf '%s' "$SPARKLE_PRIVATE_KEY" | tr -d '\r\n\t ' > "$KEY_FILE"

          # `-p` prints ONLY the EdDSA signature (no length= attribute), so the
          # appcast <enclosure> can be built with its own length. Capture
          # stdout only: stderr goes to the job log, never into the signature.
          SIGNATURE="$("$SIGN_UPDATE" -p -f "$KEY_FILE" "$DMG_PATH")"
          SIGNATURE="$(printf '%s' "$SIGNATURE" | tr -d '\r\n\t ')"
          if [ -z "$SIGNATURE" ]; then
            echo "::error::sign_update returned an empty signature."
            exit 1
          fi
          echo "EdDSA signature length: ${#SIGNATURE}"
          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"

      - name: Generate Pages site (landing page + appcast.xml)
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          SIGNATURE: ${{ steps.appcast.outputs.signature }}
          DMG_PATH: ${{ steps.stage.outputs.dmg }}
          REPOSITORY: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # The Pages site is the landing page AND the appcast. Deploying only
          # the appcast would wipe the landing page, so ship both together.
          rm -rf public
          mkdir -p public
          cp -R landing/. public/
          rm -f public/README.md

          DMG_FILENAME="$(basename "$DMG_PATH")"
          DMG_LENGTH="$(stat -f%z "$DMG_PATH")"
          PUB_DATE="$(date -u +"%a, %d %b %Y %H:%M:%S +0000")"
          OWNER_LC="$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          DOWNLOAD_URL="https://github.com/${REPOSITORY}/releases/download/v${MARKETING_VERSION}/${DMG_FILENAME}"
          # sparkle:version must equal the app's CFBundleVersion, so read it
          # from the bundle that was actually built.
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist/LumoBar.app/Contents/Info.plist)"

          cat > public/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>LumoBar</title>
              <link>https://${OWNER_LC}.github.io/${REPO_NAME}/appcast.xml</link>
              <description>Most recent LumoBar updates</description>
              <language>en</language>
              <item>
                <title>Version ${MARKETING_VERSION}</title>
                <pubDate>${PUB_DATE}</pubDate>
                <sparkle:version>${BUILD_NUMBER}</sparkle:version>
                <sparkle:shortVersionString>${MARKETING_VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <description><![CDATA[See the <a href="https://github.com/${REPOSITORY}/releases/tag/v${MARKETING_VERSION}">release notes</a> on GitHub.]]></description>
                <enclosure url="${DOWNLOAD_URL}" length="${DMG_LENGTH}" type="application/octet-stream" sparkle:edSignature="${SIGNATURE}" />
              </item>
            </channel>
          </rss>
          EOF

          echo "Generated appcast:"
          cat public/appcast.xml
          echo "Site contents:"
          ls -la public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

      - name: Upload DMG for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: ${{ steps.stage.outputs.dmg }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MARKETING_VERSION: ${{ needs.build.outputs.version }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Download DMG
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: dmg

      - name: Create (or update) the release
        run: |
          TAG="v${MARKETING_VERSION}"
          DMG="dmg/LumoBar-${MARKETING_VERSION}.dmg"
          if [ ! -f "$DMG" ]; then
            echo "::error::$DMG not found."
            ls -R dmg
            exit 1
          fi
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            # Re-run of a release that already exists: just replace the asset.
            gh release upload "$TAG" "$DMG" --clobber --repo "$REPOSITORY"
          else
            # For a manual run the tag does not exist yet; --target makes
            # GitHub create it on the commit this workflow runs for.
            gh release create "$TAG" "$DMG" \
              --repo "$REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "LumoBar ${TAG}" \
              --generate-notes
          fi

  deploy-pages:
    name: Publish site (landing page + appcast) to GitHub Pages
    # After the release, so the appcast never points to a DMG that is not
    # published yet.
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Same group as pages.yml, so a release and a landing-page deploy never
    # run at the same time.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
